<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>mfg-dl</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #090909;
                --surface: #111113;
                --surface2: #1a1a1e;
                --border: #222228;
                --border-lit: #333340;
                --amber: #f0a500;
                --amber-dim: #7a5200;
                --amber-glow: rgba(240, 165, 0, 0.12);
                --text: #d4d4d8;
                --text-dim: #52525b;
                --text-bright: #fafafa;
                --red: #ef4444;
                --green: #22c55e;
                --mono: "JetBrains Mono", monospace;
                --display: "Bebas Neue", cursive;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html {
                height: 100%;
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family: var(--mono);
                font-size: 13px;
                min-height: 100%;
                position: relative;
                overflow-x: hidden;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
                opacity: 0.025;
                pointer-events: none;
                z-index: 0;
            }

            /* Scanlines */
            body::after {
                content: "";
                position: fixed;
                inset: 0;
                background: repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.03) 2px,
                    rgba(0, 0, 0, 0.03) 4px
                );
                pointer-events: none;
                z-index: 0;
            }

            .app {
                position: relative;
                z-index: 1;
                max-width: 900px;
                margin: 0 auto;
                padding: 40px 24px 80px;
            }

            /* HEADER */
            header {
                display: flex;
                align-items: baseline;
                gap: 16px;
                margin-bottom: 48px;
                border-bottom: 1px solid var(--border);
                padding-bottom: 20px;
            }

            .logo {
                font-family: var(--display);
                font-size: 52px;
                letter-spacing: 4px;
                color: var(--amber);
                text-shadow: 0 0 40px rgba(240, 165, 0, 0.4);
                line-height: 1;
            }

            .logo-sub {
                color: var(--text-dim);
                font-size: 11px;
                letter-spacing: 0.2em;
                text-transform: uppercase;
            }

            .api-status {
                margin-left: auto;
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 11px;
                color: var(--text-dim);
            }

            .status-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--text-dim);
                transition: background 0.3s;
            }
            .status-dot.ok {
                background: var(--green);
                box-shadow: 0 0 6px var(--green);
            }
            .status-dot.err {
                background: var(--red);
            }

            /* API BASE */
            .api-config {
                display: flex;
                gap: 8px;
                margin-bottom: 32px;
                align-items: center;
            }

            .api-label {
                color: var(--text-dim);
                font-size: 11px;
                letter-spacing: 0.15em;
                white-space: nowrap;
            }

            /* INPUTS */
            input[type="text"] {
                background: var(--surface);
                border: 1px solid var(--border);
                color: var(--text-bright);
                font-family: var(--mono);
                font-size: 13px;
                padding: 10px 14px;
                outline: none;
                transition:
                    border-color 0.2s,
                    box-shadow 0.2s;
                width: 100%;
            }

            input[type="text"]:focus {
                border-color: var(--amber);
                box-shadow:
                    0 0 0 1px var(--amber),
                    inset 0 0 20px var(--amber-glow);
            }

            input[type="text"]::placeholder {
                color: var(--text-dim);
            }

            /* BUTTONS */
            button {
                font-family: var(--mono);
                font-size: 12px;
                letter-spacing: 0.1em;
                cursor: pointer;
                border: none;
                transition: all 0.15s;
                white-space: nowrap;
            }

            .btn-primary {
                background: var(--amber);
                color: #000;
                padding: 10px 20px;
                font-weight: 700;
                text-transform: uppercase;
            }

            .btn-primary:hover {
                background: #ffc333;
                box-shadow: 0 0 20px rgba(240, 165, 0, 0.35);
            }
            .btn-primary:active {
                transform: scale(0.98);
            }
            .btn-primary:disabled {
                background: var(--amber-dim);
                color: #333;
                cursor: not-allowed;
            }

            .btn-ghost {
                background: transparent;
                color: var(--text-dim);
                padding: 8px 16px;
                border: 1px solid var(--border);
                text-transform: uppercase;
            }

            .btn-ghost:hover {
                border-color: var(--border-lit);
                color: var(--text);
            }

            .btn-sm {
                background: var(--surface2);
                color: var(--amber);
                padding: 6px 12px;
                border: 1px solid var(--amber-dim);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.1em;
            }

            .btn-sm:hover {
                background: var(--amber-glow);
                border-color: var(--amber);
            }
            .btn-sm.selected {
                background: var(--amber);
                color: #000;
                font-weight: 700;
            }

            .btn-download {
                background: transparent;
                color: var(--green);
                padding: 8px 16px;
                border: 1px solid #166534;
                font-size: 11px;
                text-transform: uppercase;
            }

            .btn-download:hover {
                background: rgba(34, 197, 94, 0.1);
                border-color: var(--green);
                box-shadow: 0 0 12px rgba(34, 197, 94, 0.2);
            }
            .btn-download:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            /* STEPS */
            .step {
                margin-bottom: 24px;
                opacity: 0;
                transform: translateY(8px);
                animation: stepIn 0.3s forwards;
            }

            @keyframes stepIn {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .step-header {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 12px;
            }

            .step-num {
                font-family: var(--display);
                font-size: 28px;
                color: var(--amber);
                line-height: 1;
                min-width: 28px;
            }

            .step-title {
                font-size: 11px;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                color: var(--text-dim);
            }

            .step-body {
                border: 1px solid var(--border);
                background: var(--surface);
                padding: 16px;
            }

            /* CARDS GRID */
            .card-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }

            .card {
                border: 1px solid var(--border);
                background: var(--surface2);
                padding: 0;
                cursor: pointer;
                transition: all 0.15s;
                position: relative;
                overflow: hidden;
            }

            .card::before {
                content: "";
                position: absolute;
                inset: 0;
                background: var(--amber-glow);
                opacity: 0;
                transition: opacity 0.2s;
            }

            .card:hover {
                border-color: var(--amber-dim);
            }
            .card:hover::before {
                opacity: 1;
            }
            .card.selected {
                border-color: var(--amber);
                box-shadow: 0 0 0 1px var(--amber-dim);
            }
            .card.selected::before {
                opacity: 1;
            }

            .card-poster {
                width: 100%;
                aspect-ratio: 2/3;
                object-fit: cover;
                display: block;
                background: var(--surface2);
                margin-bottom: 10px;
                border-bottom: 1px solid var(--border);
            }

            .card-poster-placeholder {
                width: 100%;
                aspect-ratio: 2/3;
                background: var(--surface2);
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--text-dim);
                font-size: 28px;
                margin-bottom: 10px;
                border-bottom: 1px solid var(--border);
            }

            .card-name {
                font-size: 12px;
                font-weight: 500;
                color: var(--text-bright);
                margin-bottom: 4px;
                line-height: 1.4;
                padding: 0 12px;
            }

            .card-meta {
                font-size: 10px;
                color: var(--text-dim);
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                padding: 0 12px 12px;
            }

            .card-score {
                color: var(--amber);
                font-weight: 700;
                font-size: 11px;
                margin-top: 6px;
            }

            /* LIST */
            .list-item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                border-bottom: 1px solid var(--border);
                cursor: pointer;
                transition: background 0.1s;
            }

            .list-item:last-child {
                border-bottom: none;
            }
            .list-item:hover {
                background: var(--surface2);
            }
            .list-item.selected {
                background: var(--amber-glow);
            }

            .list-item input[type="checkbox"] {
                accent-color: var(--amber);
                width: 14px;
                height: 14px;
                cursor: pointer;
                flex-shrink: 0;
            }

            .list-num {
                color: var(--text-dim);
                font-size: 11px;
                min-width: 32px;
                text-align: right;
            }

            .list-title {
                flex: 1;
                font-size: 12px;
                color: var(--text-bright);
            }

            .list-alt {
                color: var(--text-dim);
                font-size: 11px;
                max-width: 200px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            /* TAGS */
            .tag {
                display: inline-block;
                font-size: 10px;
                letter-spacing: 0.1em;
                padding: 2px 6px;
                text-transform: uppercase;
                border: 1px solid;
            }

            .tag-amber {
                color: var(--amber);
                border-color: var(--amber-dim);
                background: var(--amber-glow);
            }
            .tag-green {
                color: var(--green);
                border-color: #166534;
                background: rgba(34, 197, 94, 0.08);
            }
            .tag-dim {
                color: var(--text-dim);
                border-color: var(--border);
            }

            /* SEARCH ROW */
            .search-row {
                display: flex;
                gap: 8px;
            }

            /* SERVICE PILLS */
            .service-pills {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }

            /* STREAMS TABLE */
            .stream-list {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .stream-item {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 10px 12px;
                border: 1px solid var(--border);
                background: var(--surface2);
                transition: all 0.15s;
            }

            .stream-info {
                flex: 1;
                display: flex;
                gap: 10px;
                align-items: center;
                flex-wrap: wrap;
            }

            /* TOOLBAR */
            .toolbar {
                display: flex;
                gap: 8px;
                margin-bottom: 10px;
                flex-wrap: wrap;
                align-items: center;
            }

            .toolbar-sep {
                height: 16px;
                width: 1px;
                background: var(--border);
            }

            /* TOAST */
            #toast-container {
                position: fixed;
                bottom: 24px;
                right: 24px;
                z-index: 100;
                display: flex;
                flex-direction: column;
                gap: 8px;
                align-items: flex-end;
            }

            .toast {
                background: var(--surface);
                border: 1px solid var(--border-lit);
                padding: 12px 16px;
                font-size: 12px;
                max-width: 320px;
                animation: toastIn 0.2s ease;
                display: flex;
                gap: 10px;
                align-items: flex-start;
            }

            .toast.ok {
                border-color: #166534;
            }
            .toast.err {
                border-color: #991b1b;
            }

            @keyframes toastIn {
                from {
                    opacity: 0;
                    transform: translateX(16px);
                }
                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }

            /* SPINNER */
            .spinner {
                width: 16px;
                height: 16px;
                border: 2px solid var(--border-lit);
                border-top-color: var(--amber);
                border-radius: 50%;
                animation: spin 0.6s linear infinite;
                flex-shrink: 0;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .loading-row {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 16px;
                color: var(--text-dim);
                font-size: 12px;
            }

            /* PIPELINE TRACK */
            .pipeline {
                display: flex;
                gap: 6px;
                align-items: center;
                margin-bottom: 32px;
                flex-wrap: wrap;
            }

            .pipe-step {
                font-size: 10px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--text-dim);
                padding: 4px 10px;
                border: 1px solid var(--border);
                transition: all 0.2s;
            }

            .pipe-step.done {
                color: var(--amber);
                border-color: var(--amber-dim);
            }
            .pipe-step.active {
                color: #000;
                background: var(--amber);
                border-color: var(--amber);
            }

            .pipe-arrow {
                color: var(--border-lit);
                font-size: 12px;
            }

            /* EMPTY */
            .empty {
                padding: 32px;
                text-align: center;
                color: var(--text-dim);
                font-size: 12px;
                border: 1px dashed var(--border);
            }

            /* DESCRIPTION */
            .desc-text {
                font-size: 11px;
                color: var(--text-dim);
                line-height: 1.6;
                margin-top: 8px;
                font-family: var(--mono);
                border-left: 2px solid var(--amber-dim);
                padding-left: 10px;
            }

            /* SELECT ALL */
            .select-all-row {
                display: flex;
                gap: 8px;
                align-items: center;
                margin-bottom: 8px;
                font-size: 11px;
                color: var(--text-dim);
            }

            /* DIVIDER */
            .divider {
                height: 1px;
                background: var(--border);
                margin: 8px 0;
            }

            hr {
                border: none;
                border-top: 1px solid var(--border);
                margin: 32px 0;
            }

            /* SCROLL */
            .scrollable {
                max-height: 400px;
                overflow-y: auto;
                scrollbar-width: thin;
                scrollbar-color: var(--amber-dim) transparent;
            }

            .dl-result {
                padding: 12px;
                border: 1px solid #166534;
                background: rgba(34, 197, 94, 0.06);
                font-size: 12px;
                color: var(--green);
                margin-top: 8px;
            }

            .err-result {
                padding: 12px;
                border: 1px solid #991b1b;
                background: rgba(239, 68, 68, 0.06);
                font-size: 12px;
                color: var(--red);
                margin-top: 8px;
            }

            .mono-dim {
                color: var(--text-dim);
            }
            .amber {
                color: var(--amber);
            }
            .bright {
                color: var(--text-bright);
            }
            .flex {
                display: flex;
            }
            .gap-8 {
                gap: 8px;
            }
            .items-center {
                align-items: center;
            }
            .flex-1 {
                flex: 1;
            }
            .mt-8 {
                margin-top: 8px;
            }
            .mt-16 {
                margin-top: 16px;
            }
        </style>
    </head>
    <body>
        <div class="app">
            <header>
                <div>
                    <div class="logo">MFG-DL</div>
                    <div class="logo-sub">Media Download Interface</div>
                </div>
                <div class="api-status">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="status-text">checking...</span>
                </div>
            </header>

            <div class="api-config">
                <span class="api-label">API_BASE</span>
                <input
                    type="text"
                    id="api-base"
                    value="http://localhost:6702"
                    style="width: 260px"
                />
                <button class="btn-ghost" onclick="checkHealth()">PING</button>
            </div>

            <!-- PIPELINE TRACKER -->
            <div class="pipeline">
                <div class="pipe-step" id="pipe-search">search</div>
                <div class="pipe-arrow">›</div>
                <div class="pipe-step" id="pipe-service">service</div>
                <div class="pipe-arrow">›</div>
                <div class="pipe-step" id="pipe-season">season</div>
                <div class="pipe-arrow">›</div>
                <div class="pipe-step" id="pipe-episodes">episodes</div>
                <div class="pipe-arrow">›</div>
                <div class="pipe-step" id="pipe-streams">streams</div>
                <div class="pipe-arrow">›</div>
                <div class="pipe-step" id="pipe-download">download</div>
            </div>

            <div id="steps-container"></div>
        </div>

        <div id="toast-container"></div>

        <script>
            const $ = (id) => document.getElementById(id);
            const BASE = () => $("api-base").value.replace(/\/$/, "");

            // ── API helpers ──────────────────────────────────────────────────────────────
            async function api(method, path, body) {
                const opts = {
                    method,
                    headers: { "Content-Type": "application/json" },
                };
                if (body) opts.body = JSON.stringify(body);
                const r = await fetch(BASE() + path, opts);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            }

            const GET = (path) => api("GET", path);
            const POST = (path, b) => api("POST", path, b);

            // ── Toast ────────────────────────────────────────────────────────────────────
            function toast(msg, type = "ok") {
                const el = document.createElement("div");
                el.className = `toast ${type}`;
                el.innerHTML = `<span style="color:${type === "ok" ? "var(--green)" : "var(--red)"}">${type === "ok" ? "✓" : "✗"}</span><span>${msg}</span>`;
                $("toast-container").appendChild(el);
                setTimeout(() => el.remove(), 3500);
            }

            // ── Health ───────────────────────────────────────────────────────────────────
            async function checkHealth() {
                try {
                    await GET("/health");
                    $("status-dot").className = "status-dot ok";
                    $("status-text").textContent = "online";
                } catch {
                    $("status-dot").className = "status-dot err";
                    $("status-text").textContent = "offline";
                }
            }

            // ── State ────────────────────────────────────────────────────────────────────
            let state = {
                searchResult: null, // model.SearchResult with scores
                service: null, // string service name
                season: null, // model.Season
                selectedEpisodes: [], // model.Episode[]
                streams: [], // model.Stream[]
            };

            // ── Pipeline UI ──────────────────────────────────────────────────────────────
            const PIPES = [
                "search",
                "service",
                "season",
                "episodes",
                "streams",
                "download",
            ];

            function setPipe(active) {
                const idx = PIPES.indexOf(active);
                PIPES.forEach((p, i) => {
                    const el = $("pipe-" + p);
                    el.className =
                        "pipe-step" +
                        (i < idx ? " done" : i === idx ? " active" : "");
                });
            }

            function clearStepsFrom(stepId) {
                const container = $("steps-container");
                const el = $(stepId);
                if (!el) return;
                let sibling = el.nextSibling;
                while (sibling) {
                    const next = sibling.nextSibling;
                    sibling.remove();
                    sibling = next;
                }
                el.remove();
            }

            function addStep(id, num, title, content) {
                const div = document.createElement("div");
                div.className = "step";
                div.id = id;
                div.innerHTML = `
    <div class="step-header">
      <div class="step-num">${num}</div>
      <div class="step-title">${title}</div>
    </div>
    <div class="step-body">${content}</div>
  `;
                $("steps-container").appendChild(div);
                return div;
            }

            function loading(parentId) {
                const body = document.querySelector(`#${parentId} .step-body`);
                if (body)
                    body.innerHTML = `<div class="loading-row"><div class="spinner"></div><span>fetching…</span></div>`;
            }

            // ── STEP 1: SEARCH ───────────────────────────────────────────────────────────
            function renderSearch() {
                setPipe("search");
                $("steps-container").innerHTML = "";

                addStep(
                    "step-search",
                    "01",
                    "TMDB SEARCH",
                    `
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Search for a show or movie…" autofocus>
      <button class="btn-primary" onclick="runSearch()">SEARCH</button>
    </div>
    <div id="search-results" style="margin-top:12px"></div>
  `,
                );

                $("search-input").addEventListener("keydown", (e) => {
                    if (e.key === "Enter") runSearch();
                });
            }

            async function runSearch() {
                const q = $("search-input").value.trim();
                if (!q) return;
                $("search-results").innerHTML =
                    `<div class="loading-row"><div class="spinner"></div><span>searching TMDB…</span></div>`;

                try {
                    const results = await GET(
                        `/search?q=${encodeURIComponent(q)}`,
                    );
                    renderSearchResults(results);
                } catch (e) {
                    $("search-results").innerHTML =
                        `<div class="err-result">Search failed: ${e.message}</div>`;
                }
            }

            function renderSearchResults(results) {
                if (!results || results.length === 0) {
                    $("search-results").innerHTML =
                        `<div class="empty">No results found.</div>`;
                    return;
                }

                const grid = document.createElement("div");
                grid.className = "card-grid";

                results.forEach((r) => {
                    const card = document.createElement("div");
                    card.className = "card";
                    const hasCover =
                        r.cover &&
                        !r.cover.endsWith("/null") &&
                        !r.cover.endsWith("/undefined");
                    card.innerHTML = `
      ${
          hasCover
              ? `<img class="card-poster" src="${esc(r.cover)}" alt="${esc(r.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
              : ""
      }
      <div class="card-poster-placeholder" style="${hasCover ? "display:none" : ""}">🎬</div>
      <div class="card-name">${esc(r.name)}</div>
      <div class="card-meta">
        <span class="tag tag-dim">${r.productionYear || "—"}</span>
      </div>
    `;
                    card.onclick = () => selectSearchResult(r, card);
                    grid.appendChild(card);
                });

                $("search-results").innerHTML = "";
                $("search-results").appendChild(grid);
            }

            async function selectSearchResult(result, cardEl) {
                document
                    .querySelectorAll(".card")
                    .forEach((c) => c.classList.remove("selected"));
                cardEl.classList.add("selected");
                state.searchResult = result;

                clearStepsFrom("step-service");
                addStep(
                    "step-service",
                    "02",
                    "SERVICE MATCH",
                    `<div class="loading-row"><div class="spinner"></div><span>scoring services…</span></div>`,
                );

                try {
                    const scored = await POST("/score", result);
                    state.searchResult = scored;
                    renderServiceStep(scored);
                } catch (e) {
                    document.querySelector(
                        "#step-service .step-body",
                    ).innerHTML =
                        `<div class="err-result">Score failed: ${e.message}</div>`;
                }
            }

            // ── STEP 2: SERVICE ──────────────────────────────────────────────────────────
            function renderServiceStep(result) {
                setPipe("service");
                const scores = result.scores || {};
                const body = document.querySelector("#step-service .step-body");

                if (Object.keys(scores).length === 0) {
                    body.innerHTML = `<div class="empty">No service matches found.</div>`;
                    return;
                }

                const sorted = Object.entries(scores).sort(
                    (a, b) => b[1].score - a[1].score,
                );
                body.innerHTML = `<div class="service-pills">${sorted
                    .map(
                        ([svc, s]) => `
      <button class="btn-sm" onclick="selectService('${esc(svc)}', '${esc(s.query)}', this)">
        ${esc(svc)} <span style="opacity:0.6">${(s.score * 100).toFixed(0)}%</span>
      </button>
    `,
                    )
                    .join("")}</div>`;

                // Auto-select best
                body.querySelector(".btn-sm").click();
            }

            async function selectService(service, query, btn) {
                document
                    .querySelectorAll("#step-service .btn-sm")
                    .forEach((b) => b.classList.remove("selected"));
                btn.classList.add("selected");
                state.service = service;

                clearStepsFrom("step-season");
                addStep(
                    "step-season",
                    "03",
                    "SEASONS",
                    `<div class="loading-row"><div class="spinner"></div><span>fetching seasons…</span></div>`,
                );

                try {
                    // First get results from service search using matched query
                    const siteResults = await GET(
                        `/searchsite?q=${encodeURIComponent(query)}&service=${encodeURIComponent(service)}`,
                    );
                    if (!siteResults || siteResults.length === 0)
                        throw new Error("No results on service");

                    const serviceResult = { ...siteResults[0], service };
                    const seasons = await POST("/seasons", serviceResult);
                    renderSeasonStep(seasons, serviceResult);
                } catch (e) {
                    document.querySelector(
                        "#step-season .step-body",
                    ).innerHTML =
                        `<div class="err-result">Failed: ${e.message}</div>`;
                }
            }

            // ── STEP 3: SEASON ───────────────────────────────────────────────────────────
            function renderSeasonStep(seasons, serviceResult) {
                setPipe("season");
                const body = document.querySelector("#step-season .step-body");

                if (!seasons || seasons.length === 0) {
                    body.innerHTML = `<div class="empty">No seasons found.</div>`;
                    return;
                }

                body.innerHTML = `<div class="service-pills">${seasons
                    .map(
                        (s) => `
      <button class="btn-sm" data-season='${JSON.stringify(s).replace(/'/g, "&apos;")}' onclick="selectSeason(this)">
        ${esc(s.seasonLabel || "Season " + s.seasonNum)}
      </button>
    `,
                    )
                    .join("")}</div>`;
            }

            async function selectSeason(btn) {
                document
                    .querySelectorAll("#step-season .btn-sm")
                    .forEach((b) => b.classList.remove("selected"));
                btn.classList.add("selected");
                const season = JSON.parse(btn.dataset.season);
                state.season = season;

                clearStepsFrom("step-episodes");
                addStep(
                    "step-episodes",
                    "04",
                    "EPISODES",
                    `<div class="loading-row"><div class="spinner"></div><span>fetching episodes…</span></div>`,
                );

                try {
                    const episodes = await POST("/episodes", season);
                    renderEpisodesStep(episodes);
                } catch (e) {
                    document.querySelector(
                        "#step-episodes .step-body",
                    ).innerHTML =
                        `<div class="err-result">Failed: ${e.message}</div>`;
                }
            }

            // ── STEP 4: EPISODES ─────────────────────────────────────────────────────────
            let selectedEpisodes = new Set();

            function renderEpisodesStep(episodes) {
                setPipe("episodes");
                selectedEpisodes.clear();
                const body = document.querySelector(
                    "#step-episodes .step-body",
                );

                if (!episodes || episodes.length === 0) {
                    body.innerHTML = `<div class="empty">No episodes found.</div>`;
                    return;
                }

                body.innerHTML = `
    <div class="toolbar">
      <button class="btn-ghost" onclick="selectAllEpisodes(true)" style="font-size:11px;padding:6px 12px">SELECT ALL</button>
      <button class="btn-ghost" onclick="selectAllEpisodes(false)" style="font-size:11px;padding:6px 12px">CLEAR</button>
      <div class="toolbar-sep"></div>
      <span class="mono-dim" id="ep-count">0 selected</span>
      <div style="margin-left:auto">
        <button class="btn-primary" onclick="fetchStreams()" style="font-size:11px;padding:8px 16px">GET STREAMS →</button>
      </div>
    </div>
    <div class="scrollable" id="ep-list">
      ${episodes
          .map(
              (ep, i) => `
        <div class="list-item" onclick="toggleEpisode(${i}, this)">
          <input type="checkbox" id="ep-cb-${i}" onchange="updateEpCount()">
          <span class="list-num">${ep.episodeNum || String(i + 1).padStart(2, "0")}</span>
          <span class="list-title">${esc(ep.episodeTitle || ep.episodeAltTitle || "Episode " + (i + 1))}</span>
          ${ep.episodeAltTitle && ep.episodeAltTitle !== ep.episodeTitle ? `<span class="list-alt">${esc(ep.episodeAltTitle)}</span>` : ""}
        </div>
      `,
          )
          .join("")}
    </div>
  `;

                // store episodes data
                body._episodes = episodes;
            }

            function toggleEpisode(idx, row) {
                const cb = $(`ep-cb-${idx}`);
                cb.checked = !cb.checked;
                row.classList.toggle("selected", cb.checked);
                if (cb.checked) selectedEpisodes.add(idx);
                else selectedEpisodes.delete(idx);
                updateEpCount();
            }

            function selectAllEpisodes(val) {
                selectedEpisodes.clear();
                document
                    .querySelectorAll("#ep-list input[type=checkbox]")
                    .forEach((cb, i) => {
                        cb.checked = val;
                        cb.closest(".list-item").classList.toggle(
                            "selected",
                            val,
                        );
                        if (val) selectedEpisodes.add(i);
                    });
                updateEpCount();
            }

            function updateEpCount() {
                const cnt = document.querySelectorAll(
                    "#ep-list input:checked",
                ).length;
                const el = $("ep-count");
                if (el) el.textContent = `${cnt} selected`;
            }

            async function fetchStreams() {
                const body = document.querySelector(
                    "#step-episodes .step-body",
                );
                const episodes = body._episodes;
                const indices = [...selectedEpisodes].sort((a, b) => a - b);

                if (indices.length === 0) {
                    toast("Select at least one episode", "err");
                    return;
                }

                const selected = indices.map((i) => episodes[i]);
                state.selectedEpisodes = selected;

                clearStepsFrom("step-streams");
                addStep(
                    "step-streams",
                    "05",
                    "STREAMS",
                    `<div class="loading-row"><div class="spinner"></div><span>fetching streams…</span></div>`,
                );
                setPipe("streams");

                try {
                    // Fetch streams for all episodes, collect languages
                    const allStreams = [];
                    for (const ep of selected) {
                        const streams = await POST("/streams", ep);
                        if (streams && streams.length > 0)
                            allStreams.push({ ep, streams });
                    }

                    if (allStreams.length === 0)
                        throw new Error("No streams found for any episode");
                    renderStreamsStep(allStreams);
                } catch (e) {
                    document.querySelector(
                        "#step-streams .step-body",
                    ).innerHTML =
                        `<div class="err-result">Failed: ${e.message}</div>`;
                }
            }

            // ── STEP 5: STREAMS ──────────────────────────────────────────────────────────
            let streamSelections = {}; // epHref -> stream

            function renderStreamsStep(allStreams) {
                streamSelections = {};
                const body = document.querySelector("#step-streams .step-body");

                // Collect all unique languages across all episodes
                const langs = new Set();
                const hosters = new Set();
                allStreams.forEach(({ streams }) =>
                    streams.forEach((s) => {
                        langs.add(s.language);
                        hosters.add(s.hoster);
                    }),
                );

                body.innerHTML = `
    <div class="toolbar">
      <span class="mono-dim" style="font-size:11px">QUICK SELECT LANG:</span>
      ${[...langs].map((l) => `<button class="btn-sm" onclick="autoSelectLang('${esc(l)}')">${esc(l)}</button>`).join("")}
      <div style="margin-left:auto">
        <button class="btn-primary" onclick="startDownload()" style="font-size:11px;padding:8px 16px">DOWNLOAD →</button>
      </div>
    </div>
    <div class="stream-list" id="stream-list">
      ${allStreams
          .map(
              ({ ep, streams }) => `
        <div style="margin-bottom:8px" data-ep-href="${esc(ep.href)}">
          <div style="font-size:10px;color:var(--text-dim);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px;padding:4px 0;border-bottom:1px solid var(--border)">
            EP ${esc(ep.episodeNum)} — ${esc(ep.episodeTitle || ep.episodeAltTitle || "")}
          </div>
          <div class="stream-list">
            ${streams
                .map(
                    (s, si) => `
              <div class="stream-item" id="stream-${sanitizeId(ep.href)}-${si}"
                onclick="selectStream('${esc(ep.href)}', ${si}, ${JSON.stringify(JSON.stringify(s)).slice(1, -1)})">
                <span class="tag tag-dim">${esc(s.language)}</span>
                <span class="tag tag-amber">${esc(s.hoster)}</span>
                <span style="font-size:11px;color:var(--text-dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.href)}</span>
                <span id="sel-${sanitizeId(ep.href)}-${si}" style="display:none;color:var(--amber);font-size:11px">✓ SELECTED</span>
              </div>
            `,
                )
                .join("")}
          </div>
        </div>
      `,
          )
          .join("")}
    </div>
  `;

                // Store full data
                body._allStreams = allStreams;

                // Auto-select first stream per episode
                allStreams.forEach(({ ep, streams }) => {
                    if (streams.length > 0)
                        selectStream(ep.href, 0, JSON.stringify(streams[0]));
                });
            }

            function selectStream(epHref, si, streamJson) {
                const stream =
                    typeof streamJson === "string"
                        ? JSON.parse(streamJson)
                        : streamJson;
                streamSelections[epHref] = stream;

                // Clear selections for this episode
                document
                    .querySelectorAll(`[id^="stream-${sanitizeId(epHref)}-"]`)
                    .forEach((el) => {
                        el.style.borderColor = "";
                        el.style.background = "";
                        const sel = el.querySelector('[id^="sel-"]');
                        if (sel) sel.style.display = "none";
                    });

                // Highlight selected
                const el = $(`stream-${sanitizeId(epHref)}-${si}`);
                if (el) {
                    el.style.borderColor = "var(--amber)";
                    el.style.background = "var(--amber-glow)";
                    const sel = $(`sel-${sanitizeId(epHref)}-${si}`);
                    if (sel) sel.style.display = "";
                }
            }

            function autoSelectLang(lang) {
                const body = document.querySelector("#step-streams .step-body");
                if (!body._allStreams) return;
                body._allStreams.forEach(({ ep, streams }) => {
                    const match = streams.findIndex((s) => s.language === lang);
                    if (match >= 0)
                        selectStream(
                            ep.href,
                            match,
                            JSON.stringify(streams[match]),
                        );
                });
                toast(`Auto-selected: ${lang}`);
            }

            // ── STEP 6: DOWNLOAD ─────────────────────────────────────────────────────────
            async function startDownload() {
                const selections = Object.values(streamSelections);
                if (selections.length === 0) {
                    toast("No streams selected", "err");
                    return;
                }

                clearStepsFrom("step-download");
                addStep(
                    "step-download",
                    "06",
                    "DOWNLOAD",
                    `
    <div id="dl-progress"></div>
  `,
                );
                setPipe("download");

                const prog = $("dl-progress");
                prog.innerHTML = `<div class="loading-row"><div class="spinner"></div><span>Starting ${selections.length} download(s)…</span></div>`;

                let ok = 0,
                    fail = 0;
                const results = [];

                for (const stream of selections) {
                    const label = `${stream.name} S${stream.seasonNum}E${stream.episodeNum}`;
                    try {
                        await POST("/download", stream);
                        ok++;
                        results.push(
                            `<div class="dl-result">✓ ${esc(label)} — queued</div>`,
                        );
                    } catch (e) {
                        fail++;
                        results.push(
                            `<div class="err-result">✗ ${esc(label)} — ${e.message}</div>`,
                        );
                    }
                }

                prog.innerHTML = `
    <div style="display:flex;gap:12px;margin-bottom:12px;font-size:12px">
      <span style="color:var(--green)">✓ ${ok} queued</span>
      ${fail > 0 ? `<span style="color:var(--red)">✗ ${fail} failed</span>` : ""}
    </div>
    ${results.join("")}
    <div style="margin-top:16px">
      <button class="btn-ghost" onclick="renderSearch()">← NEW SEARCH</button>
    </div>
  `;

                toast(
                    `${ok} download(s) started${fail > 0 ? `, ${fail} failed` : ""}`,
                    fail > 0 ? "err" : "ok",
                );
            }

            // ── Utilities ────────────────────────────────────────────────────────────────
            function esc(s) {
                if (!s) return "";
                return String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            function sanitizeId(s) {
                return String(s || "").replace(/[^a-zA-Z0-9]/g, "_");
            }

            // ── INIT ─────────────────────────────────────────────────────────────────────
            checkHealth();
            renderSearch();
        </script>
    </body>
</html>
