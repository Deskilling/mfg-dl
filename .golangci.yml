version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errorlint
    - forcetypeassert
    - gocritic
    - gosec
    - intrange
    - makezero
    - misspell
    - modernize
    - nilerr
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
    - wastedassign
